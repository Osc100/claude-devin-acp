# A tag (v0.1.0) builds the server for Linux, tests it first, and publishes the binaries with
# their checksums and a build provenance attestation (`gh attestation verify <file> -R Osc100/claude-devin-acp`).
name: Release

on:
  push:
    tags: ["v*"]

permissions: {}

# One release at a time, and none skipped.
concurrency:
  group: release
  cancel-in-progress: false
  queue: max

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # the release
      id-token: write # signing the attestation
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27"
          # No cache restored into a build that is published.
          cache: false

      - name: Test
        run: |
          go vet ./...
          go test ./...

      - name: Build
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            CGO_ENABLED=0 GOOS=linux GOARCH="$arch" \
              go build -trimpath -ldflags='-s -w' -o "dist/claude-devin-acp-linux-$arch" .
          done
          cd dist && sha256sum claude-devin-acp-linux-* >SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/claude-devin-acp-linux-*

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
